name: Mise à jour des matchs du Crès

on:
  schedule:
    - cron: "0 5 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matchs
  cancel-in-progress: false

jobs:
  matchs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les matchs sur le site FFVB
        run: node scripts/recuperer-matchs.mjs

      - name: Enregistrer data/matchs.json s'il a changé
        run: |
          if git diff --quiet -I '"mis_a_jour"' -- data/matchs.json && git ls-files --error-unmatch data/matchs.json >/dev/null 2>&1; then
            echo "Aucun changement dans les matchs."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/matchs.json
          git commit -m "Matchs mis à jour ($(date -u +%Y-%m-%d))"
          git push
